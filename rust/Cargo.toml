[workspace]
resolver = "2"
members = [
  "crates/winsuitex-core",
  "crates/winsuitex-platform",
  "crates/winsuitex-report",
  "crates/winsuitex-cli",
  "crates/winsuitex-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# 单 exe 分发是硬需求（网吧/电竞酒店一台台拷贝），体积直接影响传输与启动。
# 用 opt-level="z" + LTO + strip 换体积：本工具是采集 + 拼字符串，IO 与系统调用
# 才是瓶颈，CPU 密集计算可忽略，损失的运行期性能换不到的体积是白赚的。
# panic="abort" 只作用于 release：dev/test 仍用 unwind，`cargo test` 不受影响。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 本地补丁：egui-wgpu 0.28.1 默认 request_adapter 用 force_fallback_adapter:false，
# 在无硬件 D3D12 适配器（虚拟机 / RDP 远程桌面 / 基础显示驱动）的环境会
# NoSuitableAdapterFound 直接退出，GUI 一闪即灭。这里替换为带「硬件优先 →
# WARP 软件回退」逻辑的本地副本：有 GPU 真机走硬件、无 GPU 环境走 WARP 仍能渲染。
# 升级 eframe 时记得同步此补丁（对照上游 lib.rs 的 request_adapter 段）。
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu-patched" }
