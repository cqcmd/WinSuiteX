[workspace]
resolver = "2"
members = [
  "crates/winsuitex-core",
  "crates/winsuitex-platform",
  "crates/winsuitex-report",
  "crates/winsuitex-cli",
  "crates/winsuitex-gui-gdi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# 单 exe 分发是硬需求（网吧/电竞酒店一台台拷贝），体积直接影响传输与启动。
# 用 opt-level="z" + LTO + strip 换体积：本工具是采集 + 拼字符串，IO 与系统调用
# 才是瓶颈，CPU 密集计算可忽略，损失的运行期性能换不到的体积是白赚的。
# panic="abort" 只作用于 release：dev/test 仍用 unwind，`cargo test` 不受影响。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 诊断构建（崩溃定位用，Z.W. 1024×768 真机无界面排查）：
# 继承 release 的体积优化，但改 `panic = "unwind"` —— release 的 `abort` 下
# `panic_immediate_abort` 不进 panic hook、也不捕获位置，双击崩溃时看不到任何信息。
# `unwind` 下 panic hook 能写 file:line + 调用栈到 `winsuitex-gui-gdi.log`。
# 仅用于排查，定位后回退到普通 `release`；不要把 diag 当产品发布。
# `lto = false` + `strip = false`：让 panic 的 file:line 不被 LTO 重映射、
# 调用栈能解出真实函数名（第一次 diag 构建是 strip+LTO，栈全 `<unknown>`）。
[profile.diag]
inherits = "release"
panic = "unwind"
lto = false
strip = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

