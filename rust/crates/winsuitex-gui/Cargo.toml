[package]
name = "winsuitex-gui"
version.workspace = true
edition.workspace = true

[dependencies]
winsuitex-core = { path = "../winsuitex-core" }
winsuitex-platform = { path = "../winsuitex-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
egui = "0.28"
# 渲染后端：默认只有 glow(OpenGL)。但网吧/电竞酒店环境常跑在
# ① 无独显的虚拟机 ② RDP 远程桌面会话 里——这些场景没有 OpenGL 2.0+，
# glow 会直接 PainterError 退出（控制台一闪即灭、无界面）。
# 因此显式启用 wgpu 后端，它在 Windows 上走 D3D12（真机独显/集显直接可用）。
# 本机 VM 无可用 D3D12 硬件适配器、且 wgpu 0.20/0.21 不能回退 WARP，
# 故 VM 上仍起不来——但交给 main() 的错误处理弹中文 MessageBox 说明原因，
# 不再静默崩溃。真机（有显卡）走 wgpu 硬件后端正常显示。
eframe = { version = "0.28", features = ["wgpu"] }
egui_extras = { version = "0.28", features = ["svg"] }
# 渲染后端初始化失败时弹 Win32 MessageBox 说明原因（避免静默退出、控制台一闪即灭）。
windows = { version = "0.48", features = ["Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "winsuitex-gui"
path = "src/main.rs"
